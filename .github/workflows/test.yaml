name: Github cloud run test

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      test_plan_type:
        description: "Select the test plan"
        required: true
        type: choice
        options:
          - Smoke
          - Regression
        default: Regression

env:
  PROJECT: 'SwiftRadio.xcodeproj'
  SCHEME: 'SwiftRadioUITests'
  DERIVED_DATA_PATH: 'DerivedData'
  TEST_RESULTS: './TestResults.xcresult'
  ALLURE_RESULTS: 'allure-results'
  SIMULATOR_VERSION: '18.6'
  SIMULATOR_NAME: 'iPhone 16'

jobs:
  build:
    name: Build
    runs-on: [macos-15]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Show toolchain info (debug)
        run: |
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices

      - name: resolve spm dependency
        run: xcodebuild -resolvePackageDependencies

      - name: Build Project
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
          -project ${{ env.PROJECT }} \
          -scheme ${{ env.SCHEME }} \
          -derivedDataPath ${{ env.DERIVED_DATA_PATH }} \
          -destination 'platform=iOS Simulator,name=${{ env.SIMULATOR_NAME }},OS=${{ env.SIMULATOR_VERSION }}' \
          CODE_SIGNING_ALLOWED='NO' \
          | xcbeautify --renderer github-actions
          
          mkdir TestData
          patterns=("*.xctest" "*.app" "*.xctestrun" "*.framework" "*.bundle")
          for pattern in "${patterns[@]}"; do 
            find "${{ env.DERIVED_DATA_PATH }}" -name "$pattern" -print | pax -rw -pe "TestData"; 
          done
          echo "artifacts_path=TestData/${{ env.DERIVED_DATA_PATH }}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          path: ${{ steps.build.outputs.artifacts_path }}
          name: TestData
          retention-days: 30

  test:
    name: Run ${{ github.event.inputs.test_type }} tests
    runs-on: [macos-15]
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TestData
          path: ${{ env.DERIVED_DATA_PATH }}

      - name: Download Allure Parser of XCResults
        run: |
          curl -OL https://github.com/eroshenkoam/xcresults/releases/download/1.19.0/xcresults
          chmod +x xcresults
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Allure 3
        run: npm install -g allure@3

      - name: Run Ui Tests
        run: |
          # По cron input пустой — запускаем Regression
          TEST_PLAN="${{ github.event.inputs.test_plan_type }}"
          TEST_PLAN="${TEST_PLAN:-Regression}"
          # Имя .xctestrun содержит версию SDK раннера, поэтому ищем по маске
          XCTESTRUN=$(ls DerivedData/Build/Products/SwiftRadioUITests_${TEST_PLAN}_iphonesimulator*.xctestrun | head -1)
          echo "xctestrun: $XCTESTRUN"
          xcodebuild test-without-building \
          -xctestrun "$XCTESTRUN" \
          -destination 'platform=iOS Simulator,name=${{ env.SIMULATOR_NAME }},OS=${{ env.SIMULATOR_VERSION }}' \
          -resultBundlePath ./TestResults.xcresult \
          CODE_SIGNING_ALLOWED='NO' \
          | xcbeautify --renderer github-actions
        continue-on-error: true

      - name: Set env for allure
        run: |
          MARKETING_VERSION=$(xcodebuild -showBuildSettings | grep MARKETING_VERSION | awk '{print $3}')
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> $GITHUB_ENV
          BUILD_VERSION=$(xcodebuild -showBuildSettings | grep CURRENT_PROJECT_VERSION | awk '{print $3}')
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          ALLURE_VERSION=$(allure --version)
          echo "ALLURE_VERSION=$ALLURE_VERSION" >> $GITHUB_ENV

      - name: Restore Allure history from gh-pages
        run: |
          mkdir -p allure-history
          if git fetch --depth=1 origin gh-pages; then
            git show FETCH_HEAD:history.jsonl > allure-history/history.jsonl \
              || { echo "history.jsonl не найден в gh-pages, начинаем историю с нуля"; rm -f allure-history/history.jsonl; }
          else
            echo "Ветка gh-pages не найдена, начинаем историю с нуля"
          fi

      - name: Generate Allure files
        run: |
          mkdir ${{ env.ALLURE_RESULTS }}
          ./xcresults export TestResults.xcresult -o ${{ env.ALLURE_RESULTS }}
          chmod +x scripts/testOpsReportFormatter.sh
          scripts/testOpsReportFormatter.sh
          chmod +x scripts/createAllureEnvironment.sh
          scripts/createAllureEnvironment.sh
          allure generate ${{ env.ALLURE_RESULTS }} --config allurerc.mjs --history-limit 20
          # Кладём историю в отчёт, чтобы она опубликовалась в gh-pages и была доступна следующему запуску
          cp allure-history/history.jsonl allure-report/history.jsonl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-report/
          retention-days: 1

      - name: Upload XCResult
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ./TestResults.xcresult
          retention-days: 1

  report:
    runs-on: [ubuntu-latest]
    name: Report to Allure
    needs: test
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

  notification:
    runs-on: macos-15
    needs: test
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: TestResults
          path: ./TestResults.xcresult

      - name: Parse and send results to Telegram
        run: |
          xcrun xcresulttool get --path ./TestResults.xcresult --format json --legacy > result.json
          total=$(jq -r '.metrics.testsCount._value' result.json)
          failed=$(jq -r '.metrics.testsFailedCount._value' result.json)
          skipped=$(jq -r '.metrics.testsSkippedCount._value' result.json)
          passed=$((total - failed - skipped))

          TEXT="*🧪 Результаты тестов:*
          ✅ Успешных: $passed
          ❌ Упавших: $failed
          ⏭ Пропущенных: $skipped
          📊 Всего: $total"

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=97403731 \
            -d text="$TEXT"
